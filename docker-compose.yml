services:
  db: 
    image: postgres:16
    container_name: budgetflow-db
    restart: unless-stopped
    env_file:
        - .env
    environment: 
      POSTGRES_DB: budgetflow
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports: 
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: